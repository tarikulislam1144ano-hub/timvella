<style>
*{box-sizing:border-box}
:root{
  --bg:#070707;
  --card:#111113;
  --card2:#171719;
  --gold:#d7b56d;
  --gold2:#f0d69b;
  --text:#f5f3ed;
  --muted:#96969d;
  --border:rgba(255,255,255,.09);
}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:
    radial-gradient(circle at 80% 0%,rgba(215,181,109,.12),transparent 30%),
    var(--bg);
  color:var(--text);
  font:15px/1.6 Inter,Arial,sans-serif;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:70px 70px;
  z-index:-1;
}

/* NAVBAR */
header{
  position:sticky;
  top:0;
  z-index:50;
  padding:14px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(7,7,7,.78);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.logo{
  font-size:21px;
  letter-spacing:4px;
  color:var(--gold2);
  font-weight:800;
}

nav{
  display:flex;
  align-items:center;
  gap:28px;
}

nav a{
  color:#c9c9cd;
  text-decoration:none;
  font-size:13px;
  font-weight:600;
  transition:.25s;
}

nav a:hover{
  color:var(--gold2);
}

/* HERO */
.hero{
  min-height:76vh;
  padding:80px 7%;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 78% 45%,rgba(215,181,109,.18),transparent 25%),
    radial-gradient(circle at 20% 50%,rgba(255,255,255,.035),transparent 35%);
}

.hero:after{
  content:"⌚";
  position:absolute;
  right:9%;
  top:50%;
  transform:translateY(-50%) rotate(-10deg);
  font-size:230px;
  opacity:.08;
  filter:drop-shadow(0 30px 40px #000);
}

.hero small{
  color:var(--gold2);
  letter-spacing:4px;
  font-weight:700;
}

h1{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:clamp(55px,8vw,100px);
  line-height:.94;
  letter-spacing:-4px;
  margin:20px 0;
}

.gold{
  color:var(--gold2);
}

.muted{
  color:var(--muted);
  line-height:1.8;
  max-width:600px;
}

/* BUTTONS */
.btn,
button{
  border:0;
  border-radius:999px;
  padding:13px 21px;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  color:#15110a;
  font-weight:800;
  cursor:pointer;
  transition:.25s;
}

.btn{
  text-decoration:none;
  display:inline-block;
  margin-top:18px;
}

.btn:hover,
button:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(215,181,109,.2);
}

/* SECTIONS */
section{
  padding:90px 6%;
  max-width:1400px;
  margin:auto;
}

.title{
  text-align:center;
  margin-bottom:35px;
}

.title h2{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:clamp(34px,5vw,55px);
  margin:8px 0;
}

/* SEARCH */
.toolbar{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
  padding:12px;
  margin-bottom:28px;
  background:rgba(255,255,255,.025);
  border:1px solid var(--border);
  border-radius:18px;
}

input,
select,
textarea{
  width:100%;
  padding:13px 15px;
  background:#0d0d0f;
  color:#eee;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  transition:.2s;
}

input:focus,
select:focus,
textarea:focus{
  border-color:rgba(215,181,109,.6);
  box-shadow:0 0 0 3px rgba(215,181,109,.07);
}

.toolbar input{
  max-width:360px;
}

.toolbar select{
  max-width:190px;
}

/* PRODUCT GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(245px,1fr));
  gap:20px;
}

.card{
  background:linear-gradient(180deg,#141416,#0d0d0f);
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 15px 45px rgba(0,0,0,.25);
  transition:.3s;
}

.card:hover{
  transform:translateY(-7px);
  border-color:rgba(215,181,109,.35);
  box-shadow:0 25px 65px rgba(0,0,0,.45);
}

.photo{
  height:290px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 35%,rgba(215,181,109,.14),transparent 50%),
    linear-gradient(145deg,#202024,#08080a);
  font-size:75px;
  overflow:hidden;
}

.photo img{
  transition:.4s;
}

.card:hover .photo img{
  transform:scale(1.05);
}

.info{
  padding:20px;
}

.info small{
  color:#888;
  text-transform:uppercase;
  letter-spacing:1.5px;
  font-size:10px;
}

.info h3{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:22px;
  margin:8px 0 12px;
}

.price{
  color:var(--gold2);
  font-size:21px;
  font-weight:800;
}

.old{
  text-decoration:line-through;
  color:#626269;
  font-size:12px;
  margin-left:7px;
}

.info button{
  width:100%;
  margin-top:17px;
}

/* FORM / CHECKOUT */
.row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  margin:12px 0;
}

.panel{
  max-width:1050px;
  margin:auto;
  padding:30px;
  background:linear-gradient(145deg,#141416,#0c0c0e);
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:0 25px 70px rgba(0,0,0,.3);
}

.order-item{
  border-bottom:1px solid var(--border);
  padding:14px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

/* FLOATING CART */
.cart{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:40;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
}

/* ADMIN */
#admin .panel{
  border-color:rgba(215,181,109,.14);
}

#admin h3{
  font-family:Georgia,"Times New Roman",serif;
  font-size:23px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:45px 20px;
  border-top:1px solid var(--border);
  color:#777;
  letter-spacing:.5px;
}

/* MOBILE */
@media(max-width:700px){

  header{
    padding:13px 5%;
  }

  .logo{
    font-size:17px;
    letter-spacing:3px;
  }

  nav{
    gap:12px;
  }

  nav a{
    font-size:11px;
  }

  .hero{
    min-height:68vh;
    padding:55px 6%;
  }

  .hero:after{
    font-size:150px;
    right:-15px;
  }

  h1{
    font-size:58px;
    letter-spacing:-2px;
  }

  section{
    padding:65px 5%;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .photo{
    height:300px;
  }

  .panel{
    padding:20px;
    border-radius:20px;
  }

  .row{
    grid-template-columns:1fr;
  }

  .toolbar{
    padding:10px;
  }

  .toolbar input,
  .toolbar select{
    max-width:none;
  }
}

@media(max-width:420px){

  nav a:nth-child(2){
    display:none;
  }

  h1{
    font-size:50px;
  }

  .hero{
    padding-top:45px;
  }

  .photo{
    height:270px;
  }
}
</style>
